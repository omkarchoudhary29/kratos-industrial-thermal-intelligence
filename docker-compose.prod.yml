# docker-compose.prod.yml
# =============================================================================
# Production Multi-Container Compose Stack for KRATOS V3.1
# =============================================================================
version: '3.8'

services:
  db:
    image: postgis/postgis:18-3.6
    container_name: kratos_production_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-wildfire_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${DB_NAME:-wildfire_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - kratos_internal_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kratos_production_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      PORT: 5000
      PRODUCTION: "1"
      WEB_CONCURRENCY: 3
      GUNICORN_THREADS: 4
      ENABLE_BACKGROUND_SCHEDULER: "1"
    volumes:
      - persistent_data:/app/data
      - persistent_backups:/app/backups
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - kratos_internal_net

  nginx:
    image: nginx:1.27-alpine
    container_name: kratos_production_proxy
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/kratos.conf:/etc/nginx/conf.d/default.conf:ro
      - certs_data:/etc/ssl/certs:ro
      - certs_keys:/etc/ssl/private:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - kratos_internal_net

volumes:
  postgres_data:
    driver: local
  persistent_data:
    driver: local
  persistent_backups:
    driver: local
  certs_data:
    driver: local
  certs_keys:
    driver: local

networks:
  kratos_internal_net:
    driver: bridge
