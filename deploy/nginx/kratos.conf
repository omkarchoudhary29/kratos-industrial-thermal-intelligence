# deploy/nginx/kratos.conf
# =============================================================================
# Production Reverse-Proxy & TLS Hardening Configuration for KRATOS V3.1
# =============================================================================

# Upstream WSGI cluster (Gunicorn gthread workers)
upstream kratos_backend {
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ── HTTP -> HTTPS Permanent Redirection ───────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name example-domain.org; # REPLACE_WITH_PRODUCTION_FQDN

    # Allow ACME Let's Encrypt challenge requests
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Production Server ───────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example-domain.org; # REPLACE_WITH_PRODUCTION_FQDN

    # ── TLS Certificates (Placeholders - provision via certbot or cloud PKI) ──
    ssl_certificate     /etc/ssl/certs/kratos_production.crt; # REPLACE_WITH_CERT_PATH
    ssl_certificate_key /etc/ssl/private/kratos_production.key; # REPLACE_WITH_KEY_PATH

    # ── Modern TLS Protocol & Cipher Suite ────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org https://server.arcgisonline.com; connect-src 'self'; font-src 'self'; frame-ancestors 'none';" always;

    # ── Request Sizing & Buffers ──────────────────────────────────────────────
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # ── Static React Frontend Assets ─────────────────────────────────────────
    root /app/frontend/dist;
    index index.html;

    # Serve static assets with immutable cache headers
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)\$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files \$uri =404;
    }

    # SPA routing fallback
    location / {
        try_files \$uri \$uri/ /index.html;
    }

    # ── Streaming Endpoints (AI Investigator SSE & CSV Export) ─────────────────
    location ~ ^/(api/v1/intelligence/investigate/stream|reports/.*/csv) {
        proxy_pass http://kratos_backend;
        proxy_http_version 1.1;

        # Disable buffering to preserve immediate Server-Sent Events transmission
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_set_header Connection '';
        proxy_set_header Host \$host;
        proxy_set_header X-Real-IP \$remote_addr;
        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto \$scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── General Backend API Routing ───────────────────────────────────────────
    location ~ ^/(api/|auth/|health) {
        proxy_pass http://kratos_backend;
        proxy_http_version 1.1;

        proxy_set_header Host \$host;
        proxy_set_header X-Real-IP \$remote_addr;
        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto \$scheme;
        proxy_set_header X-Forwarded-Host \$host;
        proxy_set_header X-Forwarded-Port \$server_port;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
